<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empório da Música · Atendimento</title>
<style>
  :root {
    --blue: #1b4f72; --blue-dark: #123a55; --amber: #f0a830;
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1f2933; --muted: #6b7280; --line: #e6e0d4;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         color: var(--ink); background: var(--bg); height: 100vh; display: flex; }

  /* chat */
  main { flex: 1; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto;
         height: 100vh; background: var(--card); box-shadow: 0 0 40px rgba(0,0,0,.06); }
  header { background: var(--blue); color: #fff; padding: 18px 24px;
           border-bottom: 3px solid var(--amber); display: flex; align-items: center; gap: 14px; }
  .logo { width: 42px; height: 42px; border-radius: 50%; background: var(--amber);
          display: grid; place-items: center; font-size: 22px; color: var(--blue-dark); }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .3px; }
  header p { margin: 0; font-size: 13px; opacity: .8; font-style: italic; }
  header .spacer { flex: 1; }
  header button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
                  border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  header button:hover { background: rgba(255,255,255,.22); }

  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 82%; padding: 11px 15px; border-radius: 16px; white-space: normal; }
  .msg.user { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: #f1ece2; border-bottom-left-radius: 4px; }
  .msg.bot.typing::after { content: "▍"; color: var(--amber); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .msg p { margin: 0 0 6px; } .msg p:last-child { margin: 0; }
  .msg ul { margin: 4px 0 6px; padding-left: 18px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 0 4px; align-self: flex-start; }
  .chip { font: 12px var(--mono); background: #fff; border: 1px solid var(--line); color: var(--blue);
          padding: 2px 8px; border-radius: 999px; }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 10px; }
  .suggestions button { background: #fff; border: 1px solid var(--line); border-radius: 999px;
                        padding: 6px 12px; font-size: 13px; color: var(--blue); cursor: pointer; }
  .suggestions button:hover { border-color: var(--amber); }

  form { display: flex; gap: 10px; padding: 16px 24px 20px; border-top: 1px solid var(--line); }
  input { flex: 1; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px;
          font: inherit; background: #fff; outline: none; }
  input:focus { border-color: var(--blue); }
  form button { background: var(--amber); color: var(--blue-dark); border: 0; border-radius: 12px;
                padding: 0 20px; font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }

  /* run inspector */
  aside { width: 400px; height: 100vh; overflow-y: auto; background: #fff; border-left: 1px solid var(--line);
          padding: 20px; display: none; }
  aside.open { display: block; }
  aside h2 { margin: 0 0 4px; font-size: 16px; color: var(--blue); }
  aside .hint { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
  .run { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .run .q { font-size: 13px; margin-bottom: 10px; color: var(--ink); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  .stat { background: var(--bg); border-radius: 8px; padding: 6px 8px; }
  .stat b { display: block; font-size: 15px; color: var(--blue); }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .model { font: 12px var(--mono); color: var(--muted); margin-bottom: 6px; }
  details { border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 6px; }
  summary { cursor: pointer; font: 13px var(--mono); color: var(--blue); }
  summary small { color: var(--muted); }
  pre { font: 11.5px/1.45 var(--mono); background: var(--bg); padding: 8px; border-radius: 8px;
        white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">♪</div>
    <div><h1>Empório da Música</h1><p>Sua música começa aqui.</p></div>
    <div class="spacer"></div>
    <button id="reset">Nova conversa</button>
    <button id="toggle">Runs</button>
  </header>
  <div id="messages">
    <div class="msg bot"><p>Oi! 👋 Sou o assistente da Empório da Música. Posso te ajudar com instrumentos, preços, pedidos e políticas da loja.</p></div>
  </div>
  <div class="suggestions">
    <button>Quais violões até R$1000?</button>
    <button>Quanto custa o Takamine GD20?</button>
    <button>Qual o endereço da loja?</button>
    <button>Me arrependi da compra, posso devolver?</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Escreva sua mensagem…" autocomplete="off">
    <button>Enviar</button>
  </form>
</main>

<aside id="inspector">
  <h2>Run inspector</h2>
  <p class="hint">Each turn: model, latency, tokens and every tool call with its arguments and result.</p>
  <div id="runs"><p class="empty">No runs yet.</p></div>
</aside>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = crypto.randomUUID();

// Tiny markdown: escape HTML, then **bold**, "- " lists and paragraphs.
function render(text) {
  const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                  .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  return esc.split(/\n{2,}/).map(block => {
    const lines = block.split("\n");
    if (lines.every(l => /^\s*([-*]|\d+\.)\s/.test(l)))
      return "<ul>" + lines.map(l => "<li>" + l.replace(/^\s*([-*]|\d+\.)\s/, "") + "</li>").join("") + "</ul>";
    return "<p>" + lines.join("<br>") + "</p>";
  }).join("");
}

function add(cls, html) {
  const el = document.createElement("div");
  el.className = cls; el.innerHTML = html;
  $("messages").appendChild(el);
  $("messages").scrollTop = $("messages").scrollHeight;
  return el;
}

async function send(message) {
  $("form").querySelector("button").disabled = true;
  add("msg user", render(message));
  const tools = add("tools", "");
  const bot = add("msg bot typing", "");
  let text = "";

  const res = await fetch("/api/chat", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({session_id: sessionId, message}),
  });
  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    const parts = buffer.split("\n\n"); buffer = parts.pop();
    for (const part of parts) {
      const event = JSON.parse(part.replace(/^data: /, ""));
      if (event.type === "token") { text += event.text; bot.innerHTML = render(text); }
      if (event.type === "tool") tools.innerHTML += `<span class="chip">${event.name} · ${event.ms}ms</span>`;
      if (event.type === "done") addRun(event.run);
      if (event.type === "error") text += `\n\n_(erro: ${event.message})_`, bot.innerHTML = render(text);
      $("messages").scrollTop = $("messages").scrollHeight;
    }
  }
  bot.classList.remove("typing");
  if (!tools.innerHTML) tools.remove();
  $("form").querySelector("button").disabled = false;
}

function addRun(run) {
  const runs = $("runs");
  if (runs.querySelector(".empty")) runs.innerHTML = "";
  const s = (ms) => ms == null ? "–" : (ms / 1000).toFixed(2) + "s";
  const calls = run.tool_calls.map(c => `
    <details><summary>${c.name} <small>${c.ms}ms</small></summary>
      <pre>${JSON.stringify(c.arguments, null, 2)}</pre>
      <pre>${JSON.stringify(c.result, null, 2).replace(/</g, "&lt;")}</pre>
    </details>`).join("");
  runs.insertAdjacentHTML("afterbegin", `
    <div class="run">
      <div class="q">“${run.message.replace(/</g, "&lt;")}”</div>
      <div class="model">${run.model}</div>
      <div class="stats">
        <div class="stat"><b>${s(run.total_ms)}</b><span>total</span></div>
        <div class="stat"><b>${s(run.first_token_ms)}</b><span>1st token</span></div>
        <div class="stat"><b>${run.llm_rounds}</b><span>LLM calls</span></div>
        <div class="stat"><b>${run.tool_calls.length}</b><span>tool calls</span></div>
        <div class="stat"><b>${run.prompt_tokens}</b><span>tokens in</span></div>
        <div class="stat"><b>${run.completion_tokens}</b><span>tokens out</span></div>
      </div>
      ${calls || '<p class="empty">No tools called.</p>'}
    </div>`);
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  const message = $("input").value.trim();
  if (message) { $("input").value = ""; send(message); }
};
document.querySelectorAll(".suggestions button").forEach(b => b.onclick = () => send(b.textContent));
$("toggle").onclick = () => $("inspector").classList.toggle("open");
$("reset").onclick = async () => {
  await fetch(`/api/reset/${sessionId}`, {method: "POST"});
  sessionId = crypto.randomUUID();
  $("messages").innerHTML = $("messages").firstElementChild.outerHTML;
  $("runs").innerHTML = '<p class="empty">No runs yet.</p>';
};
</script>
</body>
</html>
